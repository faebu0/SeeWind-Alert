name: Telegram
 
# Sieht nach, ob in Telegram ein Knopf gedrückt wurde, und führt es aus.
#
# Ein Bot kann seine Nachrichten nur über einen erreichbaren Server bekommen
# oder indem jemand nachfragt. Hier fragt dieser Job nach. Das heisst: ein
# Tastendruck wirkt nicht sofort, sondern beim nächsten Durchgang.
#
# GitHub hält geplante Läufe bei Andrang auch mal auf — aus fünfzehn Minuten
# können dreissig werden. Wer nicht warten mag, startet den Job unter
# Actions → Telegram → Run workflow von Hand.
 
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
 
permissions:
  contents: write
 
# Gemeinsame Gruppe mit dem Windcheck: beide schreiben ins Repository, und
# gleichzeitig ginge das schief.
concurrency:
  group: seewind
  cancel-in-progress: false
 
jobs:
  knoepfe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
 
      - name: Befehle abholen
        id: befehle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node telegram.mjs
 
      # Hat sich die Orteliste geändert, soll die Meldung nicht bis zum
      # nächsten regulären Lauf warten.
      - name: Neu rechnen
        if: steps.befehle.outputs.geaendert == 'true'
        env:
          MELDER: ${{ vars.MELDER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_BENUTZER: ${{ secrets.SMTP_BENUTZER }}
          SMTP_PASSWORT: ${{ secrets.SMTP_PASSWORT }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_EMPFAENGER: ${{ secrets.MAIL_EMPFAENGER }}
          MAIL_ABSENDER: ${{ vars.MAIL_ABSENDER }}
          MAIL_ABSENDERNAME: ${{ vars.MAIL_ABSENDERNAME }}
          ASPSMS_USERKEY: ${{ secrets.ASPSMS_USERKEY }}
          ASPSMS_PASSWORT: ${{ secrets.ASPSMS_PASSWORT }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          SMS_EMPFAENGER: ${{ secrets.SMS_EMPFAENGER }}
          SMS_ABSENDER: ${{ vars.SMS_ABSENDER }}
          SMS_MAX_ZEICHEN: ${{ vars.SMS_MAX_ZEICHEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_NAME: ${{ vars.TELEGRAM_BOT_NAME }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          KALENDER_STATUS: ${{ vars.KALENDER_STATUS }}
        run: node run.mjs
 
      - name: Änderungen sichern
        run: |
          git config user.name "windcheck"
          git config user.email "actions@users.noreply.github.com"
          git add reiseorte.json docs state
          if git diff --quiet --staged; then
            echo "Keine Änderung."
          else
            git commit -m "Telegram $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Der jeweils andere Job schreibt in dieselben Dateien. Im Normalfall
            # geht der Push durch; nur wenn nicht, wird nachgezogen.
            git push || {
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
              git push
            }
          fi
 
